<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <defs>
    <linearGradient id="redMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff161f"/>
      <stop offset="52%" stop-color="#f10a12"/>
      <stop offset="100%" stop-color="#b90008"/>
    </linearGradient>
    <linearGradient id="redTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff1b24"/>
      <stop offset="100%" stop-color="#d90810"/>
    </linearGradient>
    <linearGradient id="redMid" x1="0" y1="0" x2="1" y2="1">
