# Nginx reverse proxy config for NIKAHFIX (Next.js app running on PORT 3141
# via PM2 — see ecosystem.config.js).
#
# Install on the Ubuntu VPS:
#
#   sudo cp nikahfix.nginx.conf /etc/nginx/sites-available/nikahfix
#   sudo nano /etc/nginx/sites-available/nikahfix   # replace yourdomain.com below
#   sudo ln -s /etc/nginx/sites-available/nikahfix /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl restart nginx
#
# Then enable HTTPS (once your domain's DNS points at this server):
#
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#
# Certbot edits this file automatically to add the HTTPS server block and
# the HTTP -> HTTPS redirect — you don't need to write that part by hand.
# See DEPLOYMENT.md for the full walkthrough.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Guest photos/video can be sizeable — raise the upload/body limit a
    # little above Nginx's 1MB default so RSVP/Guest Book POSTs never get
    # rejected (their payloads are tiny, but this also covers any future
    # file-upload feature without needing to revisit this file).
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3141;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
